version: '3.8'

services:
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=mysql+pymysql://root:rootpassword@db:3306/ecommerce_db
      - QDRANT_URL=http://qdrant:6333  # Giữ lại Qdrant cho nhu cầu lọc mềm trong tương lai
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecommerce_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

# BẮT BUỘC THÊM PHẦN NÀY
volumes:
  qdrant_data: