version: '3.8'

services:
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:rootpassword@db:3306/ecommerce_db
      - QDRANT_URL=http://qdrant:6333  # Bổ sung dòng này để Backend biết đường gọi Qdrant
      - AI_API_URL=http://ai-api:8001/api/v1/embed-query
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecommerce_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  ai-api:
    build: ./ai_service
    ports:
      - "8001:8001"
    volumes:
      - ./ai_service:/app

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

# BẮT BUỘC THÊM PHẦN NÀY
volumes:
  qdrant_data: